version: "3.9"

services:

  postgres:
    image: postgres:latest

    environment:
      POSTGRES_USER: sagar
      POSTGRES_PASSWORD: sagar
      POSTGRES_DB: emos

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  neo4j:
    image: neo4j:5
    container_name: emos_neo4j
    restart: always
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  qdrant:
    image: qdrant/qdrant:latest
    container_name: emos_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data: